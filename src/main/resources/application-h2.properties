spring.application.name=BMS

# H2 in-memory database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:bms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Load the H2-specific seed after Hibernate creates the schema
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.data-locations=classpath:data-h2.sql
spring.jpa.defer-datasource-initialization=true

# Enable the H2 web console at /h2-console
spring.h2.console.enabled=true

server.port=8090
